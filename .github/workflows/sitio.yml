name: Actualizar sitio
on:
  schedule:
    - cron: '0 12,23 * * *'  # 7 am y 6 pm de Lima
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: { group: sitio, cancel-in-progress: true }
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python bajar_base.py
      - run: python -X utf8 sitio.py
        env: { CONGRESO_DB: base.db }
      - name: Publicar en la rama gh-pages
        if: vars.PUBLICAR == 'si'  # no publica hasta que se active a mano
        run: |
          cd sitio
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Sitio $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
